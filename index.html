<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupplyHouse - Component Visual QA</title>
<style>
  /* Self-hosted Maison Neue (the design system's typeface). Files in /fonts. */
  @font-face{font-family:'Maison Neue';src:url('fonts/MaisonNeueWEB-Book.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Maison Neue';src:url('fonts/MaisonNeueWEB-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
  :root{
    --sh-dark-brown:#331811; --sh-mid-brown:#603423; --sh-tan:#B7804E;
    --sh-light-tan-1:#F8F5F3; --sh-light-tan-2:#F0ECE8; --sh-light-tan-3:#ECDED1;
    --sh-white:#FFFFFF; --sh-blue:#07729C; --sh-off-white:#F4F4F4;
    --sh-black:#1E1E1E; --sh-dark-gray:#343434; --sh-mid-gray:#757575; --sh-border:#DCDCDC;
    --ok:#1d6b3f; --okbg:#dff0e6; --warn:#9a4a12; --warnbg:#fce9d9; --info:#0a5d7e; --infobg:#e4eef4;
    --sh-font:'Maison Neue','Roboto',Arial,sans-serif;
    --sidebar:280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--sh-font);color:var(--sh-dark-gray);background:var(--sh-white);line-height:1.55;font-size:15px;}
  /* top bar */
  .topbar{height:56px;background:var(--sh-dark-brown);color:#fff;display:flex;align-items:center;padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:20;border-bottom:3px solid var(--sh-tan);}
  .topbar .brand{font-weight:700;font-size:16px;}
  .topbar .brand span{color:var(--sh-tan);}
  .topbar .sub{margin-left:12px;font-size:12px;color:#c9b6a7;}
  /* layout */
  .app{display:flex;padding-top:56px;min-height:100vh;}
  .sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);border-right:1px solid var(--sh-border);background:var(--sh-light-tan-1);position:fixed;top:56px;bottom:0;overflow-y:auto;padding:16px 0;}
  .sidebar .search{margin:0 14px 12px;}
  .sidebar .search input{width:100%;padding:8px 10px;border:1px solid var(--sh-border);border-radius:0;font-family:var(--sh-font);font-size:13px;}
  .grouphd{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--sh-mid-gray);padding:12px 18px 6px;text-transform:uppercase;}
  .navitem{display:flex;align-items:center;gap:8px;padding:8px 18px;font-size:14px;color:var(--sh-dark-gray);cursor:pointer;border-left:3px solid transparent;text-decoration:none;}
  .navitem:hover{background:var(--sh-light-tan-2);}
  .navitem.active{background:#fff;border-left-color:var(--sh-blue);font-weight:700;color:var(--sh-dark-brown);}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--sh-mid-gray);}
  .dot.pass{background:#22a95c;} .dot.note{background:#f28c1e;} .dot.fail{background:#f28c1e;} .dot.fix{background:#e23b3b;} .dot.wip{background:var(--sh-blue);}
  .navitem .st{margin-left:auto;font-size:10px;font-weight:700;color:var(--sh-mid-gray);}
  /* main */
  .main{margin-left:var(--sidebar);flex:1;min-width:0;padding:0 0 60px;}
  .content{max-width:1000px;margin:0 auto;padding:32px 40px;}
  .empty{color:var(--sh-mid-gray);padding:60px 40px;text-align:center;}
  /* report styles (shared) */
  h1.rt{font-size:30px;font-weight:700;color:var(--sh-dark-brown);margin:0 0 6px;}
  .rmeta{font-size:12px;color:var(--sh-mid-gray);margin:0 0 4px;font-family:'SFMono-Regular',Consolas,monospace;}
  h2{font-size:20px;font-weight:700;color:var(--sh-dark-brown);margin:38px 0 8px;padding-bottom:8px;border-bottom:2px solid var(--sh-light-tan-3);}
  h3{font-size:15px;font-weight:700;color:var(--sh-mid-brown);margin:20px 0 8px;}
  p{margin:0 0 12px;} code{background:var(--sh-light-tan-2);padding:1px 5px;font-size:13px;font-family:'SFMono-Regular',Consolas,monospace;color:var(--sh-mid-brown);}
  .verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:8px 0;}
  .v{border:1px solid var(--sh-border);border-top:4px solid var(--sh-border);padding:14px 16px;background:#fff;}
  .v.pass{border-top-color:#22a95c;} .v.fail{border-top-color:#f28c1e;} .v.fix{border-top-color:#e23b3b;}
  .v .k{font-size:12px;font-weight:700;color:var(--sh-mid-gray);margin:0 0 4px;}
  .v .val{font-size:18px;font-weight:700;color:var(--sh-dark-brown);}
  .v.pass .val{color:#1a8d4c;} .v.fail .val{color:#c56a12;} .v.fix .val{color:#c62d2d;}
  .v .sub{font-size:12px;color:var(--sh-mid-gray);margin-top:2px;}
  table{width:100%;border-collapse:collapse;margin:12px 0 20px;font-size:13px;}
  th{background:var(--sh-dark-brown);color:#fff;font-size:12px;font-weight:700;text-align:left;padding:8px 10px;}
  td{padding:7px 10px;border:1px solid var(--sh-border);vertical-align:middle;}
  tr:nth-child(even) td{background:var(--sh-off-white);}
  .chip{display:inline-block;width:13px;height:13px;border:1px solid rgba(0,0,0,.2);vertical-align:middle;margin-right:6px;}
  .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;}
  .m{font-weight:700;} .m.y{color:var(--ok);} .m.n{color:var(--warn);}
  .swatchgrid{display:grid;grid-template-columns:160px 1fr 1fr;border:1px solid var(--sh-border);margin:14px 0;font-size:13px;}
  .swatchgrid .hd{background:var(--sh-dark-brown);color:#fff;font-weight:700;padding:8px 12px;font-size:12px;}
  .swatchgrid .cell{border-top:1px solid var(--sh-border);padding:14px 12px;display:flex;align-items:center;}
  .swatchgrid .stc{border-top:1px solid var(--sh-border);padding:14px 12px;font-weight:700;color:var(--sh-dark-brown);background:var(--sh-light-tan-1);display:flex;align-items:center;font-size:12px;}
  .btn{display:inline-flex;align-items:center;gap:8px;height:50px;padding:12px 32px;border:2px solid transparent;font-family:var(--sh-font);font-weight:700;font-size:13px;line-height:1.6;letter-spacing:0;text-transform:uppercase;border-radius:0;white-space:nowrap;}
  .btn svg{width:18px;height:18px;flex:0 0 18px;}
  .callout{padding:14px 18px;margin:16px 0;border-left:4px solid var(--sh-tan);background:var(--sh-light-tan-1);}
  .callout.warn{border-left-color:var(--warn);background:var(--warnbg);}
  .callout.info{border-left-color:var(--info);background:var(--infobg);}
  .callout strong{color:var(--sh-dark-brown);}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:0;}
  .tag.pass{background:var(--okbg);color:var(--ok);} .tag.fail{background:var(--warnbg);color:var(--warn);} .tag.obs{background:var(--infobg);color:var(--info);}
  .id{font-family:'SFMono-Regular',Consolas,monospace;font-weight:700;color:var(--sh-mid-brown);}
  .handoff{margin-top:40px;border-top:2px solid var(--sh-light-tan-3);padding-top:10px;}
  .hnote{font-size:13px;color:var(--sh-mid-gray);}
  .hcard{margin:12px 0;}
  .hbtn{font-family:var(--sh-font);font-weight:700;font-size:13px;background:var(--sh-blue);color:#fff;border:none;border-radius:0;padding:10px 16px;cursor:pointer;}
  .hbtn:hover{background:#055271;}
  .hbtn.done{background:#22a95c;}
  .hcap{font-size:12px;color:var(--sh-mid-gray);margin-top:4px;}
  @media(max-width:820px){:root{--sidebar:0px;} .sidebar{display:none;} .main{margin-left:0;}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">SupplyHouse <span>Component Visual QA</span></div>
    <div class="sub">Figma → Storybook parity</div>
  </div>
  <div class="app">
    <nav class="sidebar">
      <div class="search"><input id="q" type="text" placeholder="Find component…" oninput="VQA.filter(this.value)"></div>
      <div id="nav"></div>
    </nav>
    <main class="main"><div class="content" id="content"><div class="empty">Select a component.</div></div></main>
  </div>

<script src="reports.js"></script>
<script>
const VQA = (function(){
  const icons = {
    cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
    spin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="7.8" y2="7.8"/><line x1="16.2" y1="16.2" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="7.8" y2="16.2"/><line x1="16.2" y1="7.8" x2="19.1" y2="4.9"/></svg>',
    none:''
  };
  const data = window.VQA_REPORTS || [];
  function buildNav(list){
    const groups = {};
    (list||data).forEach(r=>{(groups[r.group]=groups[r.group]||[]).push(r);});
    const nav = document.getElementById('nav'); nav.innerHTML='';
    Object.keys(groups).forEach(g=>{
      const h=document.createElement('div');h.className='grouphd';h.textContent=g;nav.appendChild(h);
      groups[g].forEach(r=>{
        const a=document.createElement('a');a.className='navitem';a.href='#'+r.id;a.dataset.id=r.id;
        a.innerHTML='<span class="dot '+(r.statusType||'')+'"></span><span>'+r.name+'</span><span class="st">'+(r.status||'')+'</span>';
        nav.appendChild(a);
      });
    });
  }
  function render(id){
    const r = data.find(x=>x.id===id) || data[0];
    document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.id===(r&&r.id)));
    const c = document.getElementById('content');
    if(!r){c.innerHTML='<div class="empty">No reports yet.</div>';return;}
    c.innerHTML = r.html;
    const holder = c.querySelector('#vqa-swatches');
    if(holder && r.swatches){
      r.swatches.forEach(s=>{
        const st=document.createElement('div');st.className='stc';st.textContent=s.n;holder.appendChild(st);
        [0,1].forEach(()=>{
          const cell=document.createElement('div');cell.className='cell';
          const b=document.createElement('span');b.className='btn';
          b.style.background=s.bg;b.style.color=s.fg;b.style.borderColor=s.bd;
          b.innerHTML=(icons[s.icon]||'')+'<span>'+s.label+'</span>';
          cell.appendChild(b);holder.appendChild(cell);
        });
      });
    }
    if(r.tabset){
      const tab=(label,count,sel,dis)=>{
        const line=dis?'inset 0 -1px 0 #e3e3e3':(sel?'inset 0 -2px 0 #07729c':'inset 0 -1px 0 #c4c4c4');
        const txt=dis?'#c4c4c4':'#343434';
        const badge=dis?'background:#f8f8f8;color:#c4c4c4':(sel?'background:#eff5fd;color:#07729c':'background:#eeeeee;color:#343434');
        return '<span style="display:inline-flex;align-items:center;padding:8px 16px;font-weight:700;color:'+txt+';box-shadow:'+line+'">'+label+'<span style="margin-left:8px;font-size:12px;padding:1px 8px;border-radius:4px;font-weight:700;'+badge+'">'+count+'</span></span>';
      };
      const set='<span style="display:inline-flex;align-items:flex-end;font-size:14px">'+tab('Overview','3',true,false)+tab('Specs','12',false,false)+tab('Reviews','42',false,false)+tab('Archived','0',false,true)+'</span>';
      [c.querySelector('#tabfig'),c.querySelector('#tabsb')].forEach(h=>{if(h)h.innerHTML=set;});
    }
    if(r.searchset){
      const svgSearch='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.6" y2="16.6"/></svg>';
      const svgClear='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#343434" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      const mk=(o)=>{
        const trailing=o.clear
          ?'<span style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center">'+svgClear+'</span>'
          :'<span style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:'+(o.disabled?'#dcdcdc':'#07729c')+'">'+svgSearch+'</span>';
        return '<span style="display:inline-flex;align-items:center;width:250px;height:44px;border:1px solid '+o.border+';background:'+o.bg+';'+(o.glow?'box-shadow:0 0 0 3px rgba(102,175,233,0.30);':'')+'"><span style="flex:1;padding:0 16px;color:'+o.color+';font-size:14px">'+o.txt+'</span>'+trailing+'</span>';
      };
      const states={
        'default':{border:'#c4c4c4',bg:'#ffffff',color:'#757575',txt:'Search',clear:false},
        'filled':{border:'#c4c4c4',bg:'#ffffff',color:'#343434',txt:'circulator pump',clear:true},
        'focus':{border:'#66afe9',bg:'#ffffff',color:'#343434',txt:'circulator pump',clear:true,glow:true},
        'disabled':{border:'#e3e3e3',bg:'#f8f8f8',color:'#c4c4c4',txt:'Search',clear:false,disabled:true}
      };
      Object.keys(states).forEach(k=>{const html=mk(states[k]);['fig','sb'].forEach(sfx=>{const el=c.querySelector('#sf-'+k+'-'+sfx);if(el)el.innerHTML=html;});});
    }
    if(r.cardset){
      const radio=(kind)=>{
        if(kind==='checked')return '<span style="width:20px;height:20px;border-radius:50%;background:#343434;border:1px solid #343434;flex:0 0 20px;display:inline-flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:#fff;display:block"></span></span>';
        if(kind==='disabled')return '<span style="width:20px;height:20px;border-radius:50%;background:#f8f8f8;border:1px solid #e3e3e3;flex:0 0 20px;display:inline-block"></span>';
        return '<span style="width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid #c4c4c4;flex:0 0 20px;display:inline-block"></span>';
      };
      const card=(o)=>'<span style="display:inline-flex;align-items:flex-start;gap:12px;width:250px;padding:16px;background:'+o.bg+';border:'+o.border+';border-radius:6px">'+radio(o.radio)+'<span style="flex:1"><span style="display:block;font-weight:700;font-size:16px;color:'+o.txt+'">Standard shipping</span><span style="font-size:14px;color:'+o.sub+'">3 to 5 business days</span></span></span>';
      const states={
        'default':{bg:'#ffffff',border:'1px solid #c4c4c4',radio:'default',txt:'#343434',sub:'#757575'},
        'hover':{bg:'#eff5fd',border:'1px solid #c5e0f0',radio:'default',txt:'#343434',sub:'#757575'},
        'selected':{bg:'#ffffff',border:'2px solid #07729c',radio:'checked',txt:'#343434',sub:'#757575'},
        'disabled':{bg:'#f8f8f8',border:'1px solid #e3e3e3',radio:'disabled',txt:'#c4c4c4',sub:'#c4c4c4'}
      };
      Object.keys(states).forEach(k=>{const html=card(states[k]);['fig','sb'].forEach(sfx=>{const el=c.querySelector('#sc-'+k+'-'+sfx);if(el)el.innerHTML=html;});});
    }
    if(r.handoffs && r.handoffs.length){
      const sec=document.createElement('div');sec.className='handoff';
      const h=document.createElement('h2');h.textContent='Hand off to Claude Code';sec.appendChild(h);
      const note=document.createElement('p');note.className='hnote';note.textContent='Copies a context + acceptance-criteria brief to paste into Claude Code. No prescribed code - the fix approach is the dev team’s call.';sec.appendChild(note);
      r.handoffs.forEach(ho=>{
        const wrap=document.createElement('div');wrap.className='hcard';
        const btn=document.createElement('button');btn.className='hbtn';btn.textContent='⧉ Copy for Claude Code · '+ho.code;
        btn.addEventListener('click',function(){
          const done=()=>{const o=btn.textContent;btn.textContent='✓ Copied · '+ho.code;btn.classList.add('done');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done');},1500);};
          if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ho.text).then(done).catch(()=>fallback());}else{fallback();}
          function fallback(){const ta=document.createElement('textarea');ta.value=ho.text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
        });
        const cap=document.createElement('div');cap.className='hcap';cap.textContent=ho.title;
        wrap.appendChild(btn);wrap.appendChild(cap);sec.appendChild(wrap);
      });
      c.appendChild(sec);
    }
    window.scrollTo(0,0);
  }
  function route(){ const id=(location.hash||'').replace('#','')||(data[0]&&data[0].id); render(id); }
  function filter(q){
    q=(q||'').toLowerCase();
    buildNav(data.filter(r=>r.name.toLowerCase().includes(q)||r.group.toLowerCase().includes(q)));
    const active=location.hash.replace('#','');
    document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.id===active));
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('DOMContentLoaded', function(){ buildNav(); route(); });
  return { filter };
})();
</script>
</body>
</html>
